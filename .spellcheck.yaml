spellchecker: aspell
matrix:
- name: markdown
  aspell:
    lang: en
    mode: markdown
    ignore-case: true
    ignore-3:
  sources:
  - 'docs/*.md'
  pipeline:
  - pyspelling.filters.markdown
  dictionary:
    wordlists:
    - wordlist.txt
    output: wordlist.dic
    encoding: utf-8
  default_encoding: utf-8
  expect_match: true
