spellchecker: aspell
matrix:
- name: markdown
  aspell:
    lang: en
  sources:
  - 'docs/*.md'
  pipeline:
  - pyspelling.filters.markdown:
    ignores: code
  dictionary:
    wordlists:
    - wordlist.txt
    output: wordlist.dic
    encoding: utf-8
  checker:
    ignore-case: true
    ignore-3:
  filter:
    mode: markdown
  default_encoding: utf-8
  expect_match: true
